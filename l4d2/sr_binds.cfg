unbindall
bind "`" "toggleconsole"

// Interact
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "f" "+zoom"
bind "e" "+use"
bind "b" "go_away_from_keyboard"
bind "TAB" "+showscores"
bind "ESCAPE" "cancelselect"

// -- MISC --
bind "F1" "Vote Yes"
bind "F3" "Vote No"
bind "F4" "ent_create infected"
bind "F10" "disconnect"
bind "=" "noclip"

// -- CYCLER & SST --
bind "/" "cycler_reset"
bind "," "cycler_next"
bind "." "cycler_prev"
bind "mouse5" "callvote ChangeDifficulty Impossible; callvote ChangeDifficulty Easy; Vote Yes"
bind "mouse4" "cycler_callvote"
bind "g" "stop; sst_l4d_quickreset; record speed"

// -- Radial Menu / Communication --
bind "z" "r_cleardecals"
bind "x" "+mouse_menu QA"
bind "v" "vocalize SmartLook"
bind "y" "messagemode"
bind "u" "messagemode2"

// Movement
bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "SHIFT" "+speed"

// Inventory
// - Flashlight
bind "capslock" "impulse 100"
// - Spray
bind "t" "impulse 201"
bind "MWHEELUP" "invprev"
bind "MWHEELDOWN" "invnext"
bind "r" "+reload"
bind "0" "slot10"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"
bind "q" "lastinv"

bind "W" "+forward"
bind "A" "+moveleft"
bind "S" "+back"
bind "D" "+moveright"

echo "LOADED BINDS"

