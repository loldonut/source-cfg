bind "`" "toggleconsole"

// Interact
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "f" "+zoom"
bind "e" "+use"
bind "b" "go_away_from_keyboard"
bind "c" "+voicerecord"
bind "TAB" "+showscores"
bind "ESCAPE" "cancelselect"

// -- MISC --
// "Remove" loud audio
bind "l" "snd_restart"
bind "F1" "Vote Yes"
bind "F2" "say Tank"
bind "F3" "Vote No"
bind "F4" "ent_create infected"
bind "F5" "jpeg"
bind "F6" "disconnect"
bind "=" "noclip"

// ion's Vocalizer
bind "n" "+mouse_menu Enemies"
bind "p" "+mouse_menu Characters"
bind "g" "+ch7; alias -ch7 -mouse_menu"

// Tab + Net Graph
bind "TAB" "+scoregraph"
alias "+scoregraph" "+showscores; net_graph 4"
alias "-scoregraph" "-showscores; net_graph 0"

// -- Radial Menu / Communication --
bind "n" "+mouse_menu Enemies"
bind "z" "+mouse_menu Orders"
bind "x" "+mouse_menu QA"
bind "v" "vocalize SmartLook"
bind "y" "messagemode"
bind "u" "messagemode2"

// Movement
bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "SHIFT" "+speed"

// Inventory
// - Flashlight
bind "capslock" "impulse 100"
// - Spray
bind "t" "impulse 201"
bind "MWHEELUP" "invprev"
bind "MWHEELDOWN" "invnext"
bind "r" "+reload; r_cleardecals"
bind "0" "slot10"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"
bind "q" "lastinv"

// Null cancelling movement script
bind "W" "+mfwd; r_cleardecals"
bind "A" "+mleft; r_cleardecals"
bind "S" "+mback; r_cleardecals"
bind "D" "+mright; r_cleardecals"

alias +mfwd "dsp_volume 0;-back;+forward;alias checkfwd +forward"
alias +mback "dsp_volume 0;-forward;+back;alias checkback +back"
alias +mleft "dsp_volume 0;-moveright;+moveleft;alias checkleft +moveleft"
alias +mright "dsp_volume 0;-moveleft;+moveright;alias checkright +moveright"
alias -mfwd "-forward;checkback;alias checkfwd none"
alias -mback "-back;checkfwd;alias checkback none"
alias -mleft "-moveleft;checkright;alias checkleft none"
alias -mright "-moveright;checkleft;alias checkright none"
alias checkfwd "none"
alias checkback "none"
alias checkleft "none"
alias checkright "none"
alias none ""

echo "LOADED BINDS"

